  /platform/organizations:
    get:
      summary: List all organizations (superadmin)
      tags: [Platform]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated organization list
        '401':
          description: Authentication required
        '403':
          description: Platform role required
    post:
      summary: Create an organization (Platform Super Admin)
      description: >
        PSA-initiated organization creation with the owner-required
        invitation/activation model: owner_email is REQUIRED and the
        initial tenant_admin owner is established via a one-time
        invitation token (hashed at rest, 7-day expiry) — never an
        invented owner. The organization is created in pending_activation
        state (active=false) and becomes operational ONLY when the owner
        redeems the token at POST /auth/invitations/accept — an ownerless
        ACTIVE organization never exists. Org row + owner invitation +
        audit commit in one transaction; subscription initialized
        consistently with self-signup (free plan default).
        Idempotency-Key is required; a replay returns the stored
        (token-free) result with X-Idempotency-Replay: true. The live
        response carries Cache-Control: no-store.
      tags: [Platform]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: Organization created (one-time invite_token shown ONLY here)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreateResponse'
        '400':
          description: Missing owner_email / invalid owner_email / missing Idempotency-Key (code VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        '403':
          description: Platform role required (or CSRF missing)
        '409':
          description: Duplicate slug or duplicate domain (code CONFLICT), or idempotency-key reuse with a different body (code IDEMPOTENCY_KEY_REUSE_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Platform admin service unavailable (code UNAVAILABLE)

