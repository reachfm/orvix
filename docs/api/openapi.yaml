  /admin/queue/messages:
    get:
      summary: List queue messages with safe attribution (tenant/domain/relay, category, retryable)
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Redacted queue list (no lease tokens, bodies, or SMTP material)

  /admin/queue/messages/{id}:
    get:
      summary: Queue entry detail with attempt history and safe attribution
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Safe detail projection
        '404':
          description: Queue entry not found

  /admin/queue/messages/{id}/retry:
    post:
      summary: Retry a queue entry (state-machine guarded; delivered/cancelled rejected)
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Entry retried
        '400':
          description: Invalid state transition (stable code invalid_state_transition)

  /admin/queue/messages/{id}/bounce:
    post:
      summary: Bounce a queue entry to dead letter (typed confirmation required)
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Confirm
          in: header
          required: true
          schema:
            type: string
            example: BOUNCE-QUEUE-1
      responses:
        '200':
          description: Entry bounced
        '428':
          description: Typed confirmation required

  /admin/queue/messages/{id}/cancel:
    post:
      summary: Cancel a queue entry (typed confirmation required)
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Confirm
          in: header
          required: true
          schema:
            type: string
            example: CANCEL-QUEUE-1
      responses:
        '200':
          description: Entry cancelled
        '428':
          description: Typed confirmation required

  /admin/queue/messages/bulk-action:
    post:
      summary: Bounded bulk queue action with per-item results (max 500 ids)
      tags: [Operations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { type: integer } }
                action: { type: string, enum: [retry, cancel, bounce] }
                reason: { type: string }
      responses:
        '200':
          description: Per-item results
        '400':
          description: Malformed body or unknown action

  /audit/logs:
    get:
      summary: List platform audit entries (filtered, paginated envelope)
      description: >
        Returns {entries, total, limit, offset} with rich extended
        entries (actor_id, actor_role, tenant_id, ip, user_agent, …).
        Filters: action, actor (numeric user id or 'user:<id>' prefix),
        tenant_id, result. Pagination: limit/offset or page/page_size
        (limit clamps to 500).
      operationId: listAuditLogs
      tags: [Security]
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: page
          in: query
          schema:
            type: integer
            description: 1-based page alias; offset = (page - 1) * limit
        - name: page_size
          in: query
          schema:
            type: integer
            description: Alias for limit
      responses:
        '200':
          description: Paginated audit envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          description: Authentication required
        '403':
          description: Platform role required

  /audit/logs/export:
    get:
      summary: Export filtered audit entries (JSON or CSV stream)
      description: >
        Reads the SAME canonical store as GET /audit/logs and
        GET /audit/logs/{id} (orvix_audit), so an export can never
        disagree with the platform audit page — entries carry the rich
        extended fields (actor_id, actor_role, tenant_id, …), never a
        lossy projection.
      tags: [Security]
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: action
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: result
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Export stream (application/json or text/csv attachment)
        '400':
          description: Invalid format
        '401':
          description: Authentication required
        '403':
          description: Platform role required

  /audit/logs/{id}:
    get:
      summary: One extended audit entry
      operationId: getAuditEntry
      tags: [Security]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Extended audit entry (same contract as list rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '400':
          description: Invalid id (code VALIDATION_FAILED)
        '401':
          description: Authentication required
        '403':
          description: Platform role required
        '404':
          description: Entry not found (code NOT_FOUND)

  # ── Support Tickets (FINAL-ENTERPRISE-COMPLETION) ───────────────
  # Shared between tenant-facing Support page (own tickets only) and
  # Platform Support Inbox (every ticket across every tenant). The
  # round-trip invariant is: TenantAdmin creates Ticket X →
  # POST /account/support-requests persists + returns X → TenantAdmin
  # can read X via GET /account/support-requests/{ref} → Platform
  # Support Inbox reads the SAME X via GET
  # /platform/support/tickets/{ref}; Tenant B cannot see X.

  /account/support-requests:
    post:
      summary: Create a support ticket (tenant-scoped to the caller's tenant)
      operationId: submitSupportRequest
      tags: [Support]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category:
                  type: string
                  enum: [general, billing, technical, security]
                subject:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                  default: normal
      responses:
        '201':
          description: Ticket persisted; full ticket row returned (reference_id, status, delivery_status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Missing fields (code VALIDATION_ERROR)
        '401':
          description: Authentication required
        '429':
          description: Rate-limited (5/10min per user)
    get:
      summary: List the caller's own support tickets (tenant-scoped)
      operationId: listOwnSupportRequests
      tags: [Support]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicket'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Authentication required

  /account/support-requests/{ref}:
    get:
      summary: Read own ticket detail + reply thread
      operationId: getOwnSupportRequest
      tags: [Support]
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket + message thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: '#/components/schemas/SupportTicket'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicketMessage'
        '401':
          description: Authentication required
        '404':
          description: Ticket not found (code NOT_FOUND)

  /account/support-requests/{ref}/reply:
    post:
      summary: Reply on own ticket (tenant author)
      operationId: replyOnOwnSupportRequest
      tags: [Support]
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Reply persisted; ticket status transitioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/SupportTicketMessage'
        '400':
          description: Missing body (code VALIDATION_ERROR)
        '401':
          description: Authentication required
        '404':
          description: Ticket not found (code NOT_FOUND)
        '409':
          description: Ticket is closed or resolved (code INVALID_STATE_TRANSITION)

  /platform/support/tickets:
    get:
      summary: List every support ticket across every tenant (Platform Support Inbox)
      operationId: listPlatformSupportTickets
      tags: [Platform Support]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicket'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Authentication required
        '403':
          description: Platform role required (platform_super_admin / superadmin)

  /platform/support/tickets/{ref}:
    get:
      summary: Read any ticket detail + reply thread
      operationId: getPlatformSupportTicket
      tags: [Platform Support]
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket + message thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: '#/components/schemas/SupportTicket'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicketMessage'
        '401':
          description: Authentication required
        '403':
          description: Platform role required
        '404':
          description: Ticket not found (code NOT_FOUND)

  /platform/support/tickets/{ref}/reply:
    post:
      summary: Platform operator reply on any ticket
      operationId: replyOnPlatformSupportTicket
      tags: [Platform Support]
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Reply persisted; ticket status transitioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/SupportTicketMessage'
        '400':
          description: Missing body (code VALIDATION_ERROR)
        '401':
          description: Authentication required
        '403':
          description: Platform role required
        '404':
          description: Ticket not found (code NOT_FOUND)
        '409':
          description: Ticket is closed (code INVALID_STATE_TRANSITION)

  /platform/support/tickets/{ref}/status:
    post:
      summary: Guarded status transition (canonical graph)
      operationId: updatePlatformSupportTicketStatus
      tags: [Platform Support]
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum:
                    [open, in_progress, waiting_for_customer, customer_replied, resolved, closed]
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Invalid status (code VALIDATION_ERROR)
        '401':
          description: Authentication required
        '403':
          description: Platform role required
        '404':
          description: Ticket not found (code NOT_FOUND)
        '409':
          description: Transition not allowed from current status (code INVALID_STATE_TRANSITION)
