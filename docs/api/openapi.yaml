openapi: "3.1.0"
info:
  title: Orvix Enterprise Mail API
  version: "1.0.0"
  description: |
    SaaS API for Orvix Enterprise Mail.
    All API endpoints are under /api/v1.
    Authentication uses JWT Bearer tokens or API keys.
servers:
  - url: https://api.orvix.email/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: api_key
      description: API key with 'orv_' prefix

  parameters:
    tenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: integer
    paginationLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    paginationOffset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        max_domains:
          type: integer
        max_mailboxes:
          type: integer
        storage_mb:
          type: integer
        send_limit_day:
          type: integer
        price_monthly:
          type: integer
        features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      properties:
        tenant_id:
          type: integer
        plan_id:
          type: string
        status:
          type: string
          enum: [trialing, active, past_due, grace_period, suspended, cancelled, expired]
        billing_interval:
          type: string
        current_period_end:
          type: string
          format: date-time
        storage_mb:
          type: integer
        send_limit_day:
          type: integer

    UsageRecord:
      type: object
      properties:
        tenant_id:
          type: integer
        period_start:
          type: string
          format: date-time
        emails_sent:
          type: integer
        emails_received:
          type: integer
        mailboxes_used:
          type: integer
        domains_used:
          type: integer
        storage_used_mb:
          type: integer
        api_calls:
          type: integer

    QuotaCheckResult:
      type: object
      properties:
        allowed:
          type: boolean
        limit:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        reason:
          type: string

    Domain:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        health_score:
          type: integer
        mailbox_count:
          type: integer
        created_at:
          type: string
          format: date-time

    OwnershipToken:
      type: object
      properties:
        status:
          type: string
          enum: [pending, verified]
        token:
          type: string
        hostname:
          type: string
        expected_value:
          type: string

    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
        plan:
          type: string
        max_domains:
          type: integer
        max_mailboxes:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expires_at:
          type: string
          format: date-time

    Mailbox:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        local_part:
          type: string
        domain:
          type: string
        quota_mb:
          type: integer
        send_limit:
          type: integer
        status:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        role:
          type: string
        scopes:
          type: array
          items:
            type: string
        last_used:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Enterprise Completion Pass surface (Phase 2 API Platform) ──

    OrganizationCreateRequest:
      type: object
      required: [name, owner_email]
      properties:
        name:
          type: string
          description: Organization display name; slugified when slug is omitted
        slug:
          type: string
          description: Unique tenant slug; derived from name when omitted
        domain:
          type: string
          description: Organization domain; UNIQUE across tenants (at most one tenant may omit it)
        owner_email:
          type: string
          format: email
          description: REQUIRED — the initial owner is established via a real tenant_admin invitation/activation model (one-time token, hashed at rest), never an invented owner user
        plan_id:
          type: string
          description: Billing plan id; defaults to the free plan (consistent with self-signup)
        max_domains:
          type: integer
        max_mailboxes:
          type: integer

    OrganizationCreateResponse:
      type: object
      required: [organization, invitation, invite_token, warning]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
          description: >
            Created in pending_activation state — active=false. The
            organization becomes operational (active=true) ONLY when the
            owner invitation is redeemed via POST /auth/invitations/accept.
            An ownerless ACTIVE organization never exists.
        invitation:
          $ref: '#/components/schemas/Invitation'
        invite_token:
          type: string
          description: One-time owner activation token. Returned ONLY in the live response — never in an idempotent replay, never persisted (only its SHA-256 hash is stored). Redeem at POST /auth/invitations/accept with a password
        warning:
          type: string

    InvitationAcceptRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: One-time invitation token (from POST /platform/organizations or POST /enterprise/invitations)
        password:
          type: string
          description: New account password (>= 8 chars, upper/lower/digit — same policy as signup)
        name:
          type: string
          description: Optional display name for the new member

    InvitationAcceptResponse:
      type: object
      required: [status, user_id, organization_id, email, role, organization_active]
      properties:
        status:
          type: string
          enum: [accepted]
        user_id:
          type: integer
        organization_id:
          type: integer
        email:
          type: string
          description: The invited email — always taken from the invitation row, never from the client
        role:
          type: string
        organization_active:
          type: boolean
          description: True unless the organization carries a deliberate open suspension

    AuditEntry:
      type: object
      description: Rich extended audit entry (orvix_audit row)
      required: [id, actor, action, result, timestamp]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
          example: "user:42"
        actor_id:
          type: integer
        actor_role:
          type: string
        tenant_id:
          type: integer
        action:
          type: string
          example: organization.create
        target:
          type: string
        target_id:
          type: integer
        result:
          type: string
          enum: [success, failure]
        reason:
          type: string
        before:
          type: string
        after:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        timestamp:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          description: Total matching rows (unbounded by this page)
        limit:
          type: integer
        offset:
          type: integer

    PlatformGroup:
      type: object
      required: [id, tenant_id, name, member_count, created_at, updated_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupMemberAddRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    BillingStateResponse:
      type: object
      required: [tenant_id, subscription, plan, usage, invoices, payment_provider]
      properties:
        tenant_id:
          type: integer
        subscription:
          allOf:
            - $ref: '#/components/schemas/Subscription'
          description: Real subscription row; null when none exists
        plan:
          allOf:
            - $ref: '#/components/schemas/Plan'
          description: Real plan row; null when no subscription exists
        usage:
          allOf:
            - $ref: '#/components/schemas/UsageRecord'
          description: Live usage for the current period; null when unavailable
        invoices:
          type: array
          items:
            type: object
          description: Real provider/webhook invoice rows; empty array when none — never fabricated paid invoices
        payment_provider:
          type: object
          required: [provider, enabled, configured, note]
          properties:
            provider:
              type: string
            enabled:
              type: boolean
            configured:
              type: boolean
              description: Honest configuration read — false when no provider is wired or it is disabled
            note:
              type: string
              example: "payment provider not configured"

    PlatformBillingOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/BillingStateResponse'
        - type: object
          required: [balance, adjustments, reconciliation]
          properties:
            balance:
              allOf:
                - type: object
                  description: platformbilling.Balance — integer minor units + currency
              description: Current ledger balance; null when the ledger store is unavailable
            adjustments:
              type: array
              items:
                type: object
              description: Ledger adjustment history (never null — empty array when none)
            reconciliation:
              allOf:
                - type: object
                  description: Read-only reconciliation report; never auto-corrects
              description: Reconciliation result; null when the ledger store is unavailable

    InvitationResendResponse:
      type: object
      required: [invitation, token, warning]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: NEW one-time token; the previous token is invalidated (stored hash rotated)
        warning:
          type: string

    # ── Support Tickets (FINAL-ENTERPRISE-COMPLETION) ───────────────
    SupportTicket:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reference_id:
          type: string
        tenant_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_email:
          type: string
          format: email
        category:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            [open, in_progress, waiting_for_customer, customer_replied, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assigned_to_id:
          type: [integer, "null"]
          format: int64
        last_reply_at:
          type: [string, "null"]
          format: date-time
        last_reply_by:
          type: [string, "null"]
          enum: [tenant, platform, ""]
        closed_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        delivery_status:
          type: string
          enum: [pending, sent, failed, disabled]
        delivery_error:
          type: [string, "null"]
    SupportTicketMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ticket_id:
          type: integer
          format: int64
        author_user_id:
          type: integer
          format: int64
        author_email:
          type: string
          format: email
        author_kind:
          type: string
          enum: [tenant, platform]
        body:
          type: string

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      summary: Authenticate and get JWT token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/invitations/accept:
    post:
      summary: Redeem an organization invitation (public, token-authenticated)
      description: >
        The PUBLIC activation path for invited members — most importantly
        the PSA-created organization owner. The organization starts in
        pending_activation (active=false) and this endpoint is the ONLY
        transition to active. The invited email is taken from the
        invitation row, never from the client; the password is
        strength-checked and bcrypt-hashed (same policy as signup).
        Platform identities can never be minted into tenant accounts; an
        existing active user with the invited email is a stable CONFLICT.
        The one-time token is consumed on success — a replay returns
        INVALID_STATE_TRANSITION, never a duplicate user. The organization
        is activated unless a deliberate suspension record exists.
        Throttled per-IP like other credential-accepting endpoints.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '200':
          description: Invitation accepted (user created, organization activated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResponse'
        '400':
          description: Invalid body / weak password (code VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or malformed token (code NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revoked/expired/already-used token (code INVALID_STATE_TRANSITION) or an account with the invited email already exists / platform identity (code CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/plans:
    get:
      summary: List available plans
      tags: [Billing]
      security: []
      responses:
        '200':
          description: Plan list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'

  /enterprise/billing/subscription:
    get:
      summary: Get current tenant subscription
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
    post:
      summary: Create or update subscription
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                billing_interval:
                  type: string
                  enum: [monthly, yearly]
                trial_days:
                  type: integer
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /enterprise/billing/state:
    get:
      summary: Coherent commercial state for the authenticated tenant
      description: >
        Subscription, plan, billing period, live usage, invoice state,
        and the payment/provider configuration. EVERY field is read from
        the real billing/usage/invoice stores — no fabricated MRR, cards,
        or paid invoices. payment_provider.configured=false is surfaced
        honestly when no provider is wired; missing rows are null/empty.
      operationId: getBillingState
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing state envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStateResponse'
        '401':
          description: Authentication required
        '403':
          description: Tenant role required

  /enterprise/billing/usage:
    get:
      summary: Get current usage metrics
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRecord'

  /enterprise/billing/quota:
    get:
      summary: Check resource quota
      tags: [Billing]
      security:
        - bearerAuth: []
      parameters:
        - name: resource
          in: query
          schema:
            type: string
            enum: [domains, mailboxes]
        - name: used
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Quota check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaCheckResult'

  /enterprise/domains:
    get:
      summary: List domains
      tags: [Domains]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
                  total:
                    type: integer
    post:
      summary: Create domain
      tags: [Domains]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        '201':
          description: Domain created

  /customer/domains:
    get:
      summary: List customer domains
      tags: [Domains]
      security:
        - bearerAuth: []

  /customer/domains/{domain_id}/verify:
    post:
      summary: Trigger DNS verification
      tags: [Domains]
      security:
        - bearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Verification result

  /enterprise/mailboxes:
    get:
      summary: List mailboxes
      tags: [Mailboxes]
      security:
        - bearerAuth: []
    post:
      summary: Create mailbox
      tags: [Mailboxes]
      security:
        - bearerAuth: []

  /enterprise/organizations/{id}:
    get:
      summary: Get organization
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

  /enterprise/invitations:
    get:
      summary: List the tenant's invitations (pending/accepted/revoked)
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitation list (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          description: Authentication required
        '403':
          description: Tenant role required
    post:
      summary: Invite a member to the organization
      description: >
        Creates a pending invitation with a one-time token (returned once,
        hashed at rest, 7-day expiry). Role must be a canonical tenant
        administration role (tenant_admin / tenant_operator /
        tenant_support / tenant_readonly). A duplicate PENDING invitation
        for the same email is a stable 409 CONFLICT — resend the existing
        one to rotate its token instead. The invitee redeems the token at
        POST /auth/invitations/accept.
      tags: [Organizations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [tenant_admin, tenant_operator, tenant_support, tenant_readonly]
      responses:
        '201':
          description: Invitation created (one-time token in this response only)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token]
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
                  token:
                    type: string
                    description: One-time redemption token; shown only here, only its SHA-256 hash is stored
        '400':
          description: Invalid email or role (code VALIDATION_FAILED)
        '401':
          description: Authentication required
        '403':
          description: Tenant role / invitations.write required
        '409':
          description: A pending invitation already exists for this email (code CONFLICT)

  /enterprise/invitations/{id}/revoke:
    post:
      summary: Revoke a pending invitation
      description: >
        Marks the invitation revoked; the token can no longer be redeemed.
        Revoking an already-accepted invitation is a stable conflict.
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        '400':
          description: Invalid invitation id (code VALIDATION_FAILED)
        '401':
          description: Authentication required
        '403':
          description: Tenant role / invitations.write required
        '404':
          description: Invitation not found in tenant (code NOT_FOUND)
        '409':
          description: Invitation already accepted (code INVALID_STATE_TRANSITION)

  /enterprise/audit/logs:
    get:
      summary: The tenant's audit entries (canonical envelope)
      description: >
        Reads the SAME canonical store the Platform Audit page reads
        (orvix_audit), scoped to the authenticated tenant, with the same
        {entries, total, limit, offset} envelope and rich extended entry
        fields — the tenant-facing audit page never sees different actions
        than the platform page, nor a second incompatible model.
        Filters: action, actor, target, result, since, until. Pagination:
        limit/offset or page (limit clamps to 500).
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: page
          in: query
          schema:
            type: integer
            description: 1-based page alias; offset = (page - 1) * limit
      responses:
        '200':
          description: Canonical audit envelope (tenant-scoped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          description: Authentication required
        '403':
          description: Tenant role required

  /enterprise/invitations/{id}/resend:
    post:
      summary: Re-issue (rotate) a pending invitation's one-time token
      description: >
        The new token replaces the previous one (stored hash rotated), so
        any prior copy is invalidated. Only pending invitations can be
        re-issued; accepted/revoked/expired ones are a stable 409
        INVALID_STATE_TRANSITION. The one-time token response carries
        Cache-Control: no-store.
      operationId: resendInvitation
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: New one-time token issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResendResponse'
        '400':
          description: Invalid invitation id (code VALIDATION_FAILED)
        '401':
          description: Authentication required
        '403':
          description: Tenant role / invitations.write required
        '404':
          description: Invitation not found in tenant (code NOT_FOUND)
        '409':
          description: Invitation is not pending (code INVALID_STATE_TRANSITION)

