name: PostgreSQL Runtime DML

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-dml:
    name: PostgreSQL DML integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orvix
          POSTGRES_PASSWORD: ci_orvix_only
          POSTGRES_DB: orvix
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ORVIX_RUN_POSTGRES_DML_TEST: 1
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: orvix
      PGPASSWORD: ci_orvix_only
      PGDATABASE: orvix

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Verify PostgreSQL connectivity
        run: |
          set -euo pipefail
          psql -c "SELECT version()"
          psql -c "SELECT 1"

      - name: Billing PostgreSQL DML tests
        run: |
          set -euo pipefail
          go test ./internal/billing/... -count=1 -timeout 120s -v

      - name: Subscription lifecycle PostgreSQL tests (single-row-per-tenant invariant)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/billing -run TestSubscriptionLifecycle -count=1 -timeout 120s -v | tee "$out"
          for name in \
            TestSubscriptionLifecycle_NoSubscriptionCreatesOneActive \
            TestSubscriptionLifecycle_ExistingActiveNotDuplicated \
            TestSubscriptionLifecycle_NonTerminalStatusesNotOverwritten \
            TestSubscriptionLifecycle_CancelledIsReactivatedDeterministically \
            TestSubscriptionLifecycle_ExpiredIsReactivatedDeterministically \
            TestSubscriptionLifecycle_RepeatedCallsStayAtOneRow \
            TestSubscriptionLifecycle_ConcurrentCallsNoDuplicateRows \
            TestSubscriptionLifecycle_UniqueIndexRejectsDirectDuplicateInsert; do
            grep -q -- "--- PASS: ${name}" "$out" || { echo "missing PASS for ${name} against PostgreSQL" >&2; exit 1; }
          done

      - name: Abuse PostgreSQL DML tests
        run: |
          set -euo pipefail
          go test ./internal/abuse/... -count=1 -timeout 120s -v

      - name: Auth (API-key rotation + session/JWT revocation) PostgreSQL tests
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/auth -run "TestRotateByID_PostgreSQL|TestSessionRevocation_PostgreSQL" -count=1 -timeout 180s -v | tee "$out"
          if grep -q -- "--- SKIP: TestRotateByID_PostgreSQL" "$out" || grep -q -- "--- SKIP: TestSessionRevocation_PostgreSQL" "$out"; then
            echo "PostgreSQL auth tests skipped; PG environment is not wired correctly" >&2
            exit 1
          fi
          grep -q -- "--- PASS: TestRotateByID_PostgreSQL" "$out"
          grep -q -- "--- PASS: TestSessionRevocation_PostgreSQL" "$out"

      - name: Signup transaction PostgreSQL tests
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/api/handlers -run "TestSignupTransactionPostgres" -count=1 -timeout 300s -v | tee "$out"
          if grep -q -- "--- SKIP: TestSignupTransactionPostgres" "$out"; then
            echo "PostgreSQL signup transaction tests skipped; PG environment is not wired correctly" >&2
            exit 1
          fi
          grep -q -- "--- PASS: TestSignupTransactionPostgresMaxOpenConnsOneNoDeadlock" "$out"
          grep -q -- "--- PASS: TestSignupTransactionPostgresSubscriptionFailureRollsBackTenantAndUser" "$out"

      - name: Bootstrap admin subscription self-heal PostgreSQL tests
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./cmd/orvix -run 'TestFreshInstall_(AdminTenantHasActiveSubscription|AdminMailboxSendIsEnforcerAllowed|SelfHealsSubscriptionForAlreadyBootstrappedTenant)' -count=1 -timeout 180s -v | tee "$out"
          for name in \
            TestFreshInstall_AdminTenantHasActiveSubscription \
            TestFreshInstall_AdminMailboxSendIsEnforcerAllowed \
            TestFreshInstall_SelfHealsSubscriptionForAlreadyBootstrappedTenant; do
            grep -q -- "--- PASS: ${name}" "$out" || { echo "missing PASS for ${name} against PostgreSQL" >&2; exit 1; }
          done

      # ── Phase 2 acceptance: deliverability (H-5/B-4) ─────────────────────
      #
      # H-5 was a PostgreSQL-ONLY defect: the deliverability aggregation
      # queries embedded raw SQLite-style `?` placeholders, so they failed at
      # the driver and the Deliverability API returned 500 on PostgreSQL.
      # SQLite runs could never catch it. These steps execute the aggregation,
      # bucket, suppression-lifecycle and cross-dialect suites against the real
      # PostgreSQL 16 service and FAIL if any of them merely skips — a skipped
      # PostgreSQL test must never be reported as acceptance.
      - name: Deliverability PostgreSQL tests (H-5/B-4)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/platform/deliverability/... -run 'Postgres|Equivalence_PostgreSQL' -count=1 -timeout 300s -v | tee "$out"
          for name in \
            TestPostgresSuppressionLifecycle \
            TestPostgresSuppressionConcurrency_UpsertSingleRow \
            TestPostgresMetricsAggregationAndBuckets \
            TestPostgresAggregate_NullFreeEmptyWindow \
            TestDeliverabilityEquivalence_PostgreSQL; do
            if grep -q -- "--- SKIP: ${name}" "$out"; then
              echo "::error::${name} SKIPPED; the PostgreSQL environment is not wired correctly" >&2
              exit 1
            fi
            grep -q -- "--- PASS: ${name}" "$out" || { echo "::error::missing PASS for ${name} against PostgreSQL" >&2; exit 1; }
          done

      # Cross-dialect equivalence: the SAME behavioural table must produce the
      # SAME numbers on SQLite, so a dialect-specific regression is caught by
      # comparison rather than by one engine's tests alone.
      - name: Deliverability SQLite equivalence counterpart
        run: |
          set -euo pipefail
          out="$(mktemp)"
          PGHOST= ORVIX_RUN_POSTGRES_DML_TEST= go test ./internal/platform/deliverability/... -run 'Equivalence_SQLite' -count=1 -timeout 300s -v | tee "$out"
          grep -q -- "--- PASS: TestDeliverabilityEquivalence_SQLite" "$out" || { echo "::error::SQLite equivalence counterpart did not pass" >&2; exit 1; }

      # ── Phase 2 acceptance: importer tenant ownership (H-7) ──────────────
      #
      # H-7 allowed platform imports to create tenant-owned entities with
      # tenant_id = 0. These steps prove the invariant on PostgreSQL: the
      # entry-point guard, the adapter choke point, immutable/cross-tenant
      # ownership, the RETURNING-id insert path (never LastInsertId), and the
      # read-only orphan diagnostic.
      - name: Importer PostgreSQL portability and tenant-ownership tests (H-7)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/platform/importer/... -run 'TestPostgresImport|TestProductionAdaptersPortableInserts|TestInsertReturningID_PostgresSQLPath' -count=1 -timeout 300s -v | tee "$out"
          for name in \
            TestPostgresImport_RejectsZeroTenantBeforeStaging \
            TestPostgresImport_AcceptsExplicitTargetTenant \
            TestPostgresImport_TargetTenantImmutableAndCrossTenantDenied \
            TestPostgresImport_AdaptersRejectTenantZero \
            TestPostgresImport_OrphanDiagnosticReportsWithoutMutating \
            TestProductionAdaptersPortableInserts \
            TestInsertReturningID_PostgresSQLPath; do
            if grep -q -- "--- SKIP: ${name}" "$out"; then
              echo "::error::${name} SKIPPED; the PostgreSQL environment is not wired correctly" >&2
              exit 1
            fi
            grep -q -- "--- PASS: ${name}" "$out" || { echo "::error::missing PASS for ${name} against PostgreSQL" >&2; exit 1; }
          done

      # ── Phase 3A acceptance: relay fail-closed hardening (Fix F) ─────────
      #
      # Fix F was a PostgreSQL-ONLY class of defect. `id, _ := res.LastInsertId()`
      # is supported on SQLite and UNSUPPORTED on PostgreSQL, and the error was
      # discarded — so routing rules and emergency overrides created on the
      # shipping dialect came back with ID 0. A rule could not be addressed for
      # update or delete, and an emergency override could never be revoked by
      # id, which is the one operation an emergency control must always
      # support. No SQLite run could observe any of it.
      #
      # These steps execute the relay acceptance suite against the real
      # PostgreSQL 16 service and FAIL if any mandatory test merely SKIPS — a
      # skipped acceptance test proves nothing, and a silently skipped suite is
      # how this class of defect reached production in the first place.
      - name: Relay PostgreSQL acceptance tests (Phase 3A Fix F)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/platform/relay/... -run 'TestPostgresRelay' -count=1 -timeout 300s -v | tee "$out"
          for name in \
            TestPostgresRelay_RoutingRuleCreateReturnsRealID \
            TestPostgresRelay_OverrideLifecycle \
            TestPostgresRelay_OverrideExpiry \
            TestPostgresRelay_ProviderMembershipAndSelection \
            TestPostgresRelay_CircuitStateAndRateLimitPersist \
            TestPostgresRelay_AttemptBookkeepingPersists \
            TestPostgresRelay_NoSQLitePlaceholdersReachPostgres \
            TestPostgresRelay_SchemaIsIdempotent \
            TestPostgresRelayAdmin_CreateReturnsIDWithoutLastInsertId \
            TestPostgresRelayAdmin_GuardedTransitionsAndVersion; do
            if grep -q -- "--- SKIP: ${name}" "$out"; then
              echo "::error::${name} SKIPPED; the PostgreSQL environment is not wired correctly" >&2
              exit 1
            fi
            grep -q -- "--- PASS: ${name}" "$out" || { echo "::error::missing PASS for ${name} against PostgreSQL" >&2; exit 1; }
          done

      # The relay fail-closed and credential-transport suites are dialect
      # independent, but they gate the same code paths the PostgreSQL steps
      # above exercise. Running them here keeps a PostgreSQL-only regression
      # from being masked by a green SQLite-only run elsewhere.
      - name: Relay fail-closed and credential-transport suites
        run: |
          set -euo pipefail
          out="$(mktemp)"
          PGHOST= ORVIX_RUN_POSTGRES_DML_TEST= go test ./internal/platform/relay/... \
            -run 'SelectRoute|ResolveProviderRoute|RuleMatches|MatchRule|SenderPattern|FallbackChain|AuthOver|DeliverAuthenticated|ValidateCredentialTransport|StartTLSDowngrade' \
            -count=1 -timeout 300s -v | tee "$out"
          grep -q -- "--- FAIL" "$out" && { echo "::error::relay fail-closed suite failed" >&2; exit 1; }
          grep -q -- "--- PASS: TestAuthOverVerifiedTLS_Succeeds" "$out" || { echo "::error::verified-TLS positive control did not run" >&2; exit 1; }
          grep -q -- "--- PASS: TestAuthOverPlaintext_RefusedAndCredentialNeverSent" "$out" || { echo "::error::plaintext-AUTH refusal did not run" >&2; exit 1; }

      - name: Delivery worker fail-closed suite (Fixes A, C, H, I)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          PGHOST= ORVIX_RUN_POSTGRES_DML_TEST= go test ./internal/coremail/delivery/... -run 'TestDeliverRemote_' -count=1 -timeout 300s -v | tee "$out"
          for name in \
            TestDeliverRemote_SuppressionStoreFailureDefersAndNeverDelivers \
            TestDeliverRemote_RouteSelectionErrorDefersNeverDirect \
            TestDeliverRemote_NilDecisionDefersNeverDirect \
            TestDeliverRemote_WalksFallbackChainInOrder \
            TestDeliverRemote_ExhaustedChainDefersNeverDirect \
            TestDeliverRemote_BookkeepingFailureNeverRedelivers; do
            grep -q -- "--- PASS: ${name}" "$out" || { echo "::error::missing PASS for ${name}" >&2; exit 1; }
          done

      # ── Queue + delivery-history PostgreSQL portability ──────────────────
      #
      # internal/coremail/queue/postgres_portability_test.go existed but was
      # never invoked with PGHOST set, so it SKIPPED in every workflow and
      # proved nothing. It covers the outbound queue and the delivery-attempt
      # history on real PostgreSQL: enqueue returning a real generated id
      # (never LastInsertId), lease, defer-with-diagnostics, boolean column
      # round-trips, and attempt recording — the portability class that SQLite
      # runs structurally cannot catch. It runs its body twice so a
      # resource-name or ordering dependency fails here rather than in
      # production.
      #
      # The step FAILS if the test merely skips: a silently skipped acceptance
      # test is indistinguishable from one that never existed.
      - name: Queue and delivery-history PostgreSQL portability
        run: |
          set -euo pipefail
          out="$(mktemp)"
          go test ./internal/coremail/queue/... -run 'TestPostgresQueueAndDeliveryHistory' -count=1 -timeout 300s -v | tee "$out"
          if grep -q -- "--- SKIP: TestPostgresQueueAndDeliveryHistory" "$out"; then
            echo "::error::TestPostgresQueueAndDeliveryHistory SKIPPED; the PostgreSQL environment is not wired correctly" >&2
            exit 1
          fi
          grep -q -- "--- PASS: TestPostgresQueueAndDeliveryHistory" "$out" || { echo "::error::missing PASS for TestPostgresQueueAndDeliveryHistory against PostgreSQL" >&2; exit 1; }
