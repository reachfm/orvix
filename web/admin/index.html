<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orvix Admin Console" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Orvix Admin Console</title>
    <script>
      // Pre-paint theme init: must run synchronously, before any CSS
      // paints, to avoid a flash of the wrong theme. Light is the
      // mandatory default — only an explicit prior "dark" choice in
      // localStorage under orvix-admin-theme switches to dark. Kept in
      // sync with src/shared/theme/theme.ts's getStoredTheme/applyTheme.
      (function () {
        try {
          if (window.localStorage.getItem("orvix-admin-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
